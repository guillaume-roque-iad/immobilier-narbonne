name: Cloudflare — déploiement manuel de secours

on:
  # Production is deployed automatically by the connected Cloudflare Workers Builds.
  # Keep this workflow as an explicit fallback to avoid duplicate production pushes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
