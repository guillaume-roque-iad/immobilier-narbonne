<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Motifs illustratifs iad : formes souples, bicolores et réutilisables. -->
    <symbol id="iad-bars" viewBox="0 0 64 48">
      <rect x="3" y="7" width="36" height="12" rx="6" fill="#00B4EC"/>
      <circle cx="51" cy="13" r="6" fill="#EA584A"/>
      <rect x="17" y="29" width="44" height="12" rx="6" fill="#EA584A"/>
      <circle cx="7" cy="35" r="6" fill="#00B4EC"/>
    </symbol>
    <symbol id="iad-duo" viewBox="0 0 64 48">
      <rect x="2" y="8" width="44" height="14" rx="7" fill="#00B4EC"/>
      <rect x="18" y="26" width="44" height="14" rx="7" fill="#EA584A"/>
    </symbol>
    <symbol id="iad-arrow" viewBox="0 0 64 48">
      <rect x="3" y="18" width="43" height="12" rx="6" fill="#EA584A"/>
      <path d="M38 7 55 24 38 41" fill="none" stroke="#00B4EC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="iad-focus" viewBox="0 0 64 48">
      <circle cx="22" cy="24" r="17" fill="#00B4EC"/>
      <circle cx="47" cy="13" r="7" fill="#EA584A"/>
      <rect x="39" y="29" width="22" height="12" rx="6" fill="#EA584A"/>
    </symbol>
    <symbol id="iad-check" viewBox="0 0 64 48">
      <rect x="9" y="22" width="29" height="12" rx="6" transform="rotate(45 9 22)" fill="#EA584A"/>
      <rect x="27" y="25" width="40" height="12" rx="6" transform="rotate(-45 27 25)" fill="#00B4EC"/>
    </symbol>
    <symbol id="iad-people" viewBox="0 0 64 48">
      <circle cx="13" cy="11" r="6" fill="#00B4EC"/>
      <rect x="7" y="20" width="12" height="23" rx="6" fill="#00B4EC"/>
      <circle cx="32" cy="8" r="7" fill="#EA584A"/>
      <rect x="25" y="18" width="14" height="27" rx="7" fill="#EA584A"/>
      <circle cx="51" cy="11" r="6" fill="#00B4EC"/>
      <rect x="45" y="20" width="12" height="23" rx="6" fill="#00B4EC"/>
    </symbol>
    <symbol id="iad-plus" viewBox="0 0 64 48">
      <rect x="4" y="18" width="38" height="12" rx="6" fill="#00B4EC"/>
      <rect x="17" y="5" width="12" height="38" rx="6" fill="#00B4EC"/>
      <circle cx="53" cy="24" r="7" fill="#EA584A"/>
    </symbol>
    <symbol id="iad-chevron" viewBox="0 0 64 48">
      <path d="M8 8 24 24 8 40M29 8l16 16-16 16" fill="none" stroke="#00B4EC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="57" cy="24" r="6" fill="#EA584A"/>
    </symbol>

    <!-- Pictogrammes d'action, dessinés dans l'esprit Material Symbols recommandé. -->
    <symbol id="arrow-outward" viewBox="0 0 24 24">
      <path d="M7 17 17 7M9 7h8v8"/>
    </symbol>
    <symbol id="close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"/>
    </symbol>
    <symbol id="star" viewBox="0 0 24 24">
      <path d="m12 2.8 2.85 5.77 6.37.93-4.61 4.49 1.09 6.34L12 17.34l-5.7 2.99 1.09-6.34L2.78 9.5l6.37-.93Z"/>
    </symbol>
  </defs>
</svg>
